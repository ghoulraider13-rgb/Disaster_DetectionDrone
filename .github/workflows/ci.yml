name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # requirements.txt pulls torch via ultralytics; CI only needs the
          # pure-Python deps to lint + run the unit tests.
          pip install pyyaml

      - name: Lint (ruff)
        run: ruff check drone_detect tests scripts

      - name: Unit tests
        run: pytest tests -v

      - name: CLI smoke test
        run: |
          python -m drone_detect datasets list
          python -m drone_detect --help
